domain-needed
bogus-priv
strict-order
bind-interfaces
# log-queries
# upstream DNS (Cloudflare)
server=1.0.0.1
server=1.1.1.1
# DHCP logging (effective only when DHCP is configured under /etc/dnsmasq.d/)
log-dhcp
# Site-local overrides (DHCP, static leases, private hosts, etc.)
conf-dir=/etc/dnsmasq.d/,*.conf
